name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r python/requirements.txt ruff

      - name: Lint Python files
        run: ruff check . --exclude .git --exclude .pytest_cache

      - name: Run Task Manager tests
        run: pytest -q projects/task-manager/tests

      - name: Run URL Shortener tests
        run: pytest -q projects/url-shortener/tests

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Task Manager image
        run: docker build -f projects/task-manager/Dockerfile -t task-manager-api:ci .
